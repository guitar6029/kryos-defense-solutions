name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Validate Prisma schema and generate client
        run: |
          npm exec -- prisma validate
          npm exec -- prisma generate
        env:
          DB_ENV: dev
          DATABASE_URL_DEV: postgresql://ci:ci@localhost:5432/kryos_ci
          DIRECT_URL_DEV: postgresql://ci:ci@localhost:5432/kryos_ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

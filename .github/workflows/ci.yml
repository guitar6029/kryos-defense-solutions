name: CI

on:
  push:
    branches: [main, master, "ci/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

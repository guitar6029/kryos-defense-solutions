name: CI

on:
  push:
    branches: [main, "ci/**", "dev/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Validate Prisma schema and generate client
        run: |
          npm exec -- prisma validate
          npm exec -- prisma generate
        env:
          DB_ENV: dev
          DATABASE_URL_DEV: postgresql://ci:ci@localhost:5432/kryos_ci
          DIRECT_URL_DEV: postgresql://ci:ci@localhost:5432/kryos_ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
